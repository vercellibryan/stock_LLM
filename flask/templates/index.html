<html>
    <head>
  <meta charset="UTF-8">
  <title>Stock Agent</title>
  <!-- Tailwind & DaisyUI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
  
  <!-- Working Marked CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
</head>
    <body>
        <div class="h-screen flex flex-col max-w-2xl mx-auto p-4">
            <!-- Chat Log Box -->
            <div id="chat-box" class="flex-1 overflow-y-auto space-y-6 p-4">
                <!-- Initial Agent Greeting -->
                <div class="flex items-start gap-3">
                <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center font-bold text-xs">AI</div>
                <div class="prose max-w-none text-base-content flex-1 pt-1">
                    Hello! How can I help you analyze stock performance today?
                </div>
                </div>
            </div>

            <!-- Input Form -->
            <form id="chat-form" class="flex gap-2 mt-4">
                <input type="text" id="symbol" value="NVDA" class="input input-bordered w-24" placeholder="Symbol" required />
                <input type="text" id="msg" class="input input-bordered flex-1" placeholder="Type a message..." required />
                <button type="submit" class="btn btn-primary">Send</button>
            </form>
        </div>
        <script>
            const form = document.getElementById('chat-form');
            const chatBox = document.getElementById('chat-box');

            form.addEventListener('submit', (e) => {
            e.preventDefault();
            const symbol = document.getElementById('symbol').value;
            const msg = document.getElementById('msg').value;

            // 1. User Message: Styled inside a pill-shaped chat bubble on the right
            chatBox.innerHTML += `
                <div class="flex justify-end my-4">
                <div class="bg-primary text-primary-content px-5 py-3 rounded-3xl max-w-lg shadow-sm">
                    ${msg}
                </div>
                </div>`;
            
            // 2. Agent Response: Plain background with icon on the left (Gemini Layout)
            const botContentId = 'bot-text-' + Date.now();
            chatBox.innerHTML += `
                <div class="flex items-start gap-3 my-4">
                <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center font-bold text-xs shrink-0">AI</div>
                <div class="prose max-w-none text-base-content flex-1 pt-1" id="${botContentId}">
                    <span class="loading loading-dots loading-sm"></span>
                </div>
                </div>`;
            
            document.getElementById('msg').value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 3. SSE Stream handling with real-time Markdown rendering
            const botElement = document.getElementById(botContentId);
            let rawMarkdown = '';
            
            const source = new EventSource(`/chat?symbol=${encodeURIComponent(symbol)}&msg=${encodeURIComponent(msg)}`);

           source.onmessage = (event) => {
                // Convert the escaped '\\n' back into real newlines for marked.js
                const unescapedChunk = event.data.replace(/\\n/g, '\n');
                rawMarkdown += unescapedChunk;
                const parseMarkdown = typeof marked === 'function' ? marked : marked.parse;
                botElement.innerHTML = parseMarkdown(rawMarkdown);
                chatBox.scrollTop = chatBox.scrollHeight;
            };

            source.onerror = () => {
                source.close();
            };
            });
        </script>
    </body>
</html>
